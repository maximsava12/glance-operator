name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/openstack-k8s-operators/s2i-openstack-containers.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
