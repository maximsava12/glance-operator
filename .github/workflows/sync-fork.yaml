name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/openstack-k8s-operators/dev-docs.git
          git fetch upstream main
          git merge upstream/main
          git push origin main
